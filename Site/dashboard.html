<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BotHub - Dashboard</title>
    <style>
        /* =========================================
           VARIÁVEIS E ESTILOS GLOBAIS
           ========================================= */
        :root { 
            --sidebar-width: 260px; 
            --bg-dark: #030407; 
            --surface: rgba(13, 16, 23, 0.75); 
            --glass-border: rgba(255, 255, 255, 0.08); 
            --accent-purple: #8b5cf6; 
            --accent-blue: #3b82f6; 
            --accent-green: #10b981; 
            --text-main: #ffffff;
            --text-muted: #8b949e; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            overflow-x: hidden; 
        }

        /* =========================================
           SIDEBAR (MENU LATERAL)
           ========================================= */
        .sidebar { 
            width: var(--sidebar-width); 
            height: 100vh; 
            background: rgba(8, 10, 15, 0.95); 
            border-right: 1px solid var(--glass-border); 
            position: fixed; 
            display: flex; 
            flex-direction: column; 
            padding: 24px; 
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .brand {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        .nav-menu { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-item.active, .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        /* =========================================
           ÁREA PRINCIPAL E CABEÇALHO
           ========================================= */
        .main-wrapper { 
            margin-left: var(--sidebar-width); 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            width: calc(100% - var(--sidebar-width)); 
        }
        
        .top-header { 
            padding: 20px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid var(--glass-border); 
            background: rgba(3, 4, 7, 0.8); 
            backdrop-filter: blur(12px); 
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            object-fit: cover;
        }

        .btn-glow { 
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); 
            border: none; 
            padding: 12px 24px; 
            border-radius: 12px; 
            color: #fff; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.3s;
        }
        .btn-glow:hover {
            box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            border-radius: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
        }

        /* =========================================
           CONTEÚDO DO DASHBOARD (LISTA DE BOTS)
           ========================================= */
        .dashboard-content { 
            padding: 40px; 
            max-width: 1200px; 
            margin: 0 auto; 
            width: 100%; 
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-card { 
            background: var(--surface); 
            border: 1px solid var(--glass-border); 
            border-radius: 20px; 
            padding: 30px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }
        
        .bot-list { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        
        .bot-item { 
            display: grid; 
            grid-template-columns: 2fr 1fr 1fr 1fr auto; 
            align-items: center; 
            padding: 20px; 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid var(--glass-border); 
            border-radius: 16px; 
            gap: 15px; 
            transition: all 0.3s;
        }
        .bot-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .bot-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .bot-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(139, 92, 246, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .badge-online { 
            background: rgba(16, 185, 129, 0.15); 
            color: var(--accent-green); 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge-offline {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        /* =========================================
           RESPONSIVIDADE
           ========================================= */
        @media (max-width: 992px) { 
            .sidebar { display: none; } 
            .main-wrapper { margin-left: 0; width: 100%; } 
            .bot-item { grid-template-columns: 1fr; text-align: center; justify-items: center; } 
            .bot-info { flex-direction: column; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">BotHub</div>
        
        <nav class="nav-menu">
            <a href="#" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Projetos
            </a>
            <a href="#" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Configurações
            </a>
        </nav>

        <button class="btn-outline" onclick="fazerLogout()">Encerrar Sessão</button>
    </aside>

    <div class="main-wrapper">
        <header class="top-header">
            <div class="user-profile">
                <img id="userAvatar" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdib3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjOGI5NDllIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik0yMCAyMXYtMmE0IDQgMCAwIDAtNC00SDhhNCA0IDAgMCAwLTQgNHYyIj48L3BhdGg+PGNpcmNsZSBjeD0iMTIiIGN5PSI3IiByPSI0Ij48L2NpcmNsZT48L3N2Zz4=" alt="Avatar" class="user-avatar">
                <div>
                    <div style="font-weight: 600;" id="userName">Carregando...</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);" id="userPlan">Plano Gratuito</div>
                </div>
            </div>
            <button class="btn-glow" onclick="alert('Funcionalidade em desenvolvimento!')">+ Novo Bot</button>
        </header>

        <main class="dashboard-content">
            <div class="section-card">
                <div class="section-header">
                    <h2>Projetos Ativos</h2>
                    <span style="color: var(--text-muted); font-size: 0.9rem;" id="botCount">0 bots</span>
                </div>
                
                <div class="bot-list" id="botListContainer">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 15px; color: #8b5cf6;">
                            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line>
                        </svg>
                        <h3>A carregar a sua infraestrutura...</h3>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // SUAS CREDENCIAIS REAIS DO BOTFORGE
        const firebaseConfig = {
            apiKey: "AIzaSyCdBUSX02dZnEisMfhQpXa1SekbUn_0clA",
            authDomain: "botforge-2de3f.firebaseapp.com",
            databaseURL: "https://botforge-2de3f-default-rtdb.firebaseio.com",
            projectId: "botforge-2de3f",
            storageBucket: "botforge-2de3f.firebasestorage.app",
            messagingSenderId: "575654861649",
            appId: "1:575654861649:web:9d3851308bbb6d74101170",
            measurementId: "G-NSBVFR4D9X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // VERIFICA SE O USUÁRIO ESTÁ LOGADO
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // Se não estiver autenticado, expulsa para o login
                window.location.href = "login.html";
            } else {
                // Atualiza a interface com os dados do usuário autenticado
                document.getElementById('userName').innerText = user.displayName || "Desenvolvedor";
                if(user.photoURL) {
                    document.getElementById('userAvatar').src = user.photoURL;
                }
                
                // Busca se ele tem um plano específico gravado no banco (opcional)
                try {
                    const userDoc = await getDoc(doc(db, "usuarios", user.uid));
                    if (userDoc.exists() && userDoc.data().plano) {
                        document.getElementById('userPlan').innerText = `Plano ${userDoc.data().plano}`;
                    }
                } catch (e) {
                    console.log("Aviso: perfil não encontrado no Firestore, usando padrão.");
                }
                
                // Carrega os bots deste usuário específico
                carregarBots(user.uid);
            }
        });

        // FUNÇÃO PARA BUSCAR E RENDERIZAR OS BOTS DO FIRESTORE
        async function carregarBots(userId) {
            const container = document.getElementById('botListContainer');
            
            try {
                // Vai na coleção de bots do usuário logado
                const querySnapshot = await getDocs(collection(db, "usuarios", userId, "bots"));
                
                document.getElementById('botCount').innerText = `${querySnapshot.size} bot(s)`;

                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3 style="color: #fff; margin-bottom: 8px;">Nenhum bot encontrado</h3>
                            <p>Você ainda não hospedou nenhum projeto. Clique em '+ Novo Bot' para começar.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = ""; // Limpa o estado de carregamento

                querySnapshot.forEach((docSnap) => {
                    const bot = docSnap.data();
                    
                    // Lógica para cor do status
                    const isOnline = bot.status === 'Online' || bot.status === 'online';
                    const badgeClass = isOnline ? 'badge-online' : 'badge-offline';
                    const statusText = isOnline ? '🟢 Online' : '🔴 Offline';
                    const botIcon = bot.icone || '🤖';

                    const botHTML = `
                        <div class="bot-item">
                            <div class="bot-info">
                                <div class="bot-icon">${botIcon}</div>
                                <div>
                                    <strong style="font-size: 1.1rem;">${bot.nome || 'Projeto Sem Nome'}</strong>
                                    <div style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Tokens encriptados no Firebase</div>
                                </div>
                            </div>
                            <div>
                                <span class="${badgeClass}">${statusText}</span>
                            </div>
                            <div>
                                <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Latência</span>
                                <strong style="font-size: 0.95rem;">${bot.ping || '--'} ms</strong>
                            </div>
                            <div>
                                <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Consumo RAM</span>
                                <strong style="font-size: 0.95rem;">${bot.ram || '--'} MB</strong>
                            </div>
                            <div>
                                <button class="btn-outline" style="padding: 8px 16px; font-size: 0.9rem;">Gerir Bot</button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += botHTML;
                });
            } catch (error) {
                console.error("Erro ao carregar bots:", error);
                container.innerHTML = `
                    <div class="empty-state" style="color: #ef4444;">
                        <p>Erro ao carregar os seus bots. Verifique as permissões do Firestore.</p>
                    </div>
                `;
            }
        }

        // FUNÇÃO DE LOGOUT
        window.fazerLogout = function() {
            signOut(auth).then(() => {
                localStorage.removeItem('botHubLogado');
                window.location.href = 'index.html'; // Volta pra página inicial / login
            });
        };
    </script>
</body>
</html>
