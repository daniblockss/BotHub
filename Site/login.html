<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BotHub - Autenticação Inteligente</title>
    <style>
        /* === RESET E VARIÁVEIS === */
        :root {
            --bg-dark: #030407;
            --surface: rgba(13, 16, 23, 0.75);
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* === ANIMAÇÕES === */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* === FUNDO AMBIENTE (GLOW) === */
        .glow-bg {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
        }
        .glow-1 { width: 40vw; height: 40vw; max-width: 400px; max-height: 400px; background: rgba(139, 92, 246, 0.2); top: -10%; left: -10%; }
        .glow-2 { width: 45vw; height: 45vw; max-width: 450px; max-height: 450px; background: rgba(59, 130, 246, 0.15); bottom: -10%; right: -10%; }

        /* === CONTAINER PRINCIPAL (GLASSMORPHISM) === */
        .login-card {
            position: relative;
            z-index: 10;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(24px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* === CABEÇALHO === */
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header .badge {
            display: inline-block; padding: 5px 14px; background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 20px; font-size: 0.75rem;
            color: var(--accent-purple); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 12px;
        }
        .login-header h2 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; line-height: 1.2; }
        .text-gradient {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% auto; animation: gradientMove 4s ease infinite;
        }
        .login-header p { color: var(--text-muted); font-size: 0.95rem; }

        /* === BOTÕES SOCIAIS === */
        .social-auth { display: flex; gap: 12px; margin-bottom: 24px; }
        .btn-social {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            padding: 12px; border-radius: 12px; color: #fff; font-size: 0.9rem; font-weight: 500;
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn-social:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
        .btn-social svg { width: 18px; height: 18px; fill: currentColor; }

        /* === DIVISOR === */
        .divider { display: flex; align-items: center; text-align: center; margin-bottom: 24px; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--glass-border); }
        .divider span { padding: 0 12px; }

        /* === INPUTS E FORMULÁRIO === */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 14px; color: #6e7681; width: 18px; height: 18px; pointer-events: none; transition: 0.3s; }
        .input-wrapper input {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border);
            padding: 14px 42px; border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.3s ease;
        }
        .input-wrapper input:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); background: rgba(0, 0, 0, 0.6); }
        .input-wrapper input:focus + .input-icon, .input-wrapper input:focus ~ .toggle-password { color: var(--accent-purple); }
        
        .toggle-password {
            position: absolute; right: 14px; background: none; border: none; color: #6e7681;
            cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .toggle-password:hover { color: #fff; }

        /* === OPÇÕES E BOTÃO SUBMIT === */
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem; }
        .remember-me { display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer; }
        .remember-me input { accent-color: var(--accent-purple); width: 16px; height: 16px; cursor: pointer; }
        .forgot-link { color: var(--accent-purple); text-decoration: none; transition: 0.3s; }
        .forgot-link:hover { color: var(--accent-blue); text-decoration: underline; }

        .btn-glow {
            width: 100%; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none; padding: 14px; border-radius: 12px; color: #fff; font-size: 1rem; font-weight: 600;
            cursor: pointer; box-shadow: 0 8px 20px -8px rgba(139, 92, 246, 0.8); transition: all 0.3s ease;
        }
        .btn-glow:hover { box-shadow: 0 12px 25px -5px rgba(139, 92, 246, 0.9); transform: translateY(-2px); }

        /* === RODAPÉ DO CARD === */
        .card-footer { margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-muted); }
        .card-footer a { color: #fff; font-weight: 600; text-decoration: none; margin-left: 5px; transition: 0.3s; }
        .card-footer a:hover { color: var(--accent-purple); }
        .back-home { display: inline-flex; align-items: center; gap: 6px; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; transition: 0.3s; }
        .back-home:hover { color: #fff; transform: translateX(-3px); }

        /* === TOAST DE NOTIFICAÇÃO === */
        .toast {
            position: fixed; top: 20px; right: 20px; background: rgba(16, 185, 129, 0.9); color: #fff;
            padding: 14px 24px; border-radius: 12px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex; align-items: center; gap: 10px; z-index: 1000; transform: translateY(-100px);
            opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); backdrop-filter: blur(10px);
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* ========================================= */
        /* RESPONSIVIDADE - TABLETS & NOTEBOOKS      */
        /* ========================================= */
        @media (max-width: 768px) {
            .login-card { padding: 35px 30px; }
            .login-header h2 { font-size: 1.9rem; }
        }

        /* ========================================= */
        /* RESPONSIVIDADE - CELULARES (SMARTPHONES)  */
        /* ========================================= */
        @media (max-width: 480px) {
            body { padding: 15px; }
            
            .login-card {
                padding: 30px 20px; /* Reduz o espaçamento interno para caber melhor */
                border-radius: 20px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); /* Sombra mais leve no celular */
            }

            .login-header h2 { font-size: 1.7rem; }
            .login-header p { font-size: 0.85rem; }

            /* Em telas muito pequenas, empilha os botões sociais */
            .social-auth { flex-direction: column; gap: 10px; }
            .btn-social { padding: 14px; /* Aumenta a área de toque no celular */ }

            /* Ajustes de formulário para toque (Touch Targets) */
            .input-wrapper input { padding: 15px 42px; font-size: 1rem; /* Previne zoom no iOS */ }
            .btn-glow { padding: 15px; font-size: 1rem; }

            .form-options { flex-direction: column; gap: 15px; align-items: flex-start; }
            .forgot-link { align-self: flex-start; }
            
            /* Ajuste da notificação para o celular */
            .toast { top: 10px; right: 10px; left: 10px; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <div id="toast" class="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toast-message">Autenticado com sucesso!</span>
    </div>

    <div class="login-card">
        
        <div class="login-header">
            <span class="badge">BOT HUB AUTH</span>
            <h2 class="text-gradient" id="form-title">Bem-vindo</h2>
            <p id="form-subtitle">Acesse sua infraestrutura de IA</p>
        </div>

        <div class="social-auth">
            <button class="btn-social" type="button" onclick="socialAuth('Discord')">
                <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/></svg>
                Discord
            </button>
            <button class="btn-social" type="button" onclick="socialAuth('GitHub')">
                <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                GitHub
            </button>
        </div>

        <div class="divider"><span>ou e-mail corporativo</span></div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)">
            
            <div class="input-group" id="name-group" style="display: none;">
                <label for="name">Nome Completo</label>
                <div class="input-wrapper">
                    <input type="text" id="name" placeholder="Seu nome">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Endereço de E-mail</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="nome@empresa.com" required>
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Mostrar/Ocultar Senha">
                        <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="form-options" id="options-row">
                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    <span>Lembrar de mim</span>
                </label>
                <a href="#" class="forgot-link" onclick="alert('Instruções enviadas para o e-mail!')">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-glow" id="submitBtn">Entrar no Dashboard</button>
        </form>

        <div class="card-footer">
            <span id="toggle-text">Ainda não tem conta?</span>
            <a href="#" id="toggle-link" onclick="switchAuthMode(event)">Criar Conta</a>
            <br>
            <a href="index.html" class="back-home">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Voltar à página inicial
            </a>
        </div>

    </div>

    <script>
        let isSignUpMode = false;

        function switchAuthMode(e) {
            e.preventDefault();
            isSignUpMode = !isSignUpMode;

            document.getElementById('form-title').innerText = isSignUpMode ? "Criar Conta" : "Bem-vindo";
            document.getElementById('form-subtitle').innerText = isSignUpMode ? "Comece a hospedar suas IAs hoje" : "Acesse sua infraestrutura de IA";
            
            const nameGroup = document.getElementById('name-group');
            nameGroup.style.display = isSignUpMode ? "block" : "none";
            document.getElementById('name').required = isSignUpMode;
            
            document.getElementById('options-row').style.display = isSignUpMode ? "none" : "flex";
            document.getElementById('submitBtn').innerText = isSignUpMode ? "Registrar Conta" : "Entrar no Dashboard";
            document.getElementById('toggle-text').innerText = isSignUpMode ? "Já tem uma conta?" : "Ainda não tem conta?";
            document.getElementById('toggle-link').innerText = isSignUpMode ? "Fazer Login" : "Criar Conta";
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                pwdInput.type = 'password';
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;

            btn.innerText = "Autenticando...";
            btn.style.opacity = "0.7";
            btn.style.pointerEvents = "none";

            setTimeout(() => {
                localStorage.setItem('botHubLogado', 'true');
                showToast(isSignUpMode ? "Conta criada com sucesso!" : "Autenticado com sucesso!");
                setTimeout(() => window.location.href = 'dashboard.html', 1200);
            }, 1000);
        }

        function socialAuth(provider) {
            showToast(`Conectando via ${provider}...`);
            setTimeout(() => {
                localStorage.setItem('botHubLogado', 'true');
                window.location.href = 'dashboard.html';
            }, 1200);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
