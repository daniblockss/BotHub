<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BotHub - Autenticação</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background: var(--bg-dark, #030407); color: var(--text-main, #fff); overflow-x: hidden; font-family: 'Inter', system-ui, sans-serif; }
        .glow-bg { position: absolute; border-radius: 50%; filter: blur(100px); z-index: 0; pointer-events: none; }
        .glow-1 { width: 40vw; height: 40vw; max-width: 400px; max-height: 400px; background: rgba(139, 92, 246, 0.2); top: -10%; left: -10%; }
        .glow-2 { width: 45vw; height: 45vw; max-width: 450px; max-height: 450px; background: rgba(59, 130, 246, 0.15); bottom: -10%; right: -10%; }
        
        .login-card { position: relative; z-index: 10; background: var(--surface, rgba(13, 16, 23, 0.75)); border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.08)); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; backdrop-filter: blur(24px); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05); text-align: center; }
        
        .login-header { margin-bottom: 35px; }
        .login-header h2 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; line-height: 1.2; }
        .login-header p { color: var(--text-muted, #8b949e); font-size: 0.95rem; }
        
        .social-auth-vertical { display: flex; flex-direction: column; gap: 16px; }
        .btn-social { display: flex; align-items: center; justify-content: center; gap: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.08)); padding: 14px; border-radius: 12px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; width: 100%; }
        .btn-social:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.2); }
        .btn-social svg { width: 22px; height: 22px; }
        
        .toast { position: fixed; top: 20px; right: 20px; background: rgba(16, 185, 129, 0.9); color: #fff; padding: 14px 24px; border-radius: 12px; font-weight: 500; display: flex; align-items: center; gap: 10px; z-index: 1000; transform: translateY(-100px); opacity: 0; transition: all 0.4s; backdrop-filter: blur(10px); }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <div id="toast" class="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toast-message">Autenticado com sucesso!</span>
    </div>

    <div class="login-card">
        <div class="login-header">
            <h2>BotHub</h2>
            <p>Faça login para gerir os seus bots</p>
        </div>

        <div class="social-auth-vertical">
            <button class="btn-social" onclick="socialAuth('Google')">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continuar com Google
            </button>

            <button class="btn-social" onclick="socialAuth('GitHub')">
                <svg viewBox="0 0 24 24" fill="#fff">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                Continuar com GitHub
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        // Importando ambos os provedores (Google e GitHub)
        import { getAuth, GithubAuthProvider, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdBUSX02dZnEisMfhQpXa1SekbUn_0clA",
            authDomain: "botforge-2de3f.firebaseapp.com",
            databaseURL: "https://botforge-2de3f-default-rtdb.firebaseio.com",
            projectId: "botforge-2de3f",
            storageBucket: "botforge-2de3f.firebasestorage.app",
            messagingSenderId: "575654861649",
            appId: "1:575654861649:web:9d3851308bbb6d74101170",
            measurementId: "G-NSBVFR4D9X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.socialAuth = async function(providerName) {
            let provider;
            
            // Define o provedor com base no botão clicado
            if (providerName === 'GitHub') {
                provider = new GithubAuthProvider();
            } else if (providerName === 'Google') {
                provider = new GoogleAuthProvider();
            }

            try {
                // Abre o popup de login
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Salva ou atualiza o usuário no banco de dados
                await setDoc(doc(db, "usuarios", user.uid), {
                    nome: user.displayName || "Usuário",
                    email: user.email,
                    avatar: user.photoURL,
                    plano: "Gratuito",
                    provedor: providerName,
                    ultimoLogin: serverTimestamp()
                }, { merge: true });

                showToast(`Bem-vindo, ${user.displayName || 'Dev'}!`);
                
                // Grava a sessão localmente e redireciona
                localStorage.setItem('botHubLogado', 'true');
                setTimeout(() => window.location.href = 'dashboard.html', 1500);

            } catch (error) {
                console.error(error);
                showToast("Erro na autenticação: " + error.message);
            }
        };
    </script>
</body>
</html>
